name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build PSParquetTools/PSParquetTools.csproj -c Release
      - name: Test (PowerShell 7)
        shell: pwsh
        run: Invoke-Pester ./PSParquetTools/IntegrationTests -CI
      - name: Test (Windows PowerShell 5.1)
        shell: powershell
        run: Invoke-Pester ./PSParquetTools/IntegrationTests -CI

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Set version from tag
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $psd1 = 'PSParquetTools/ParquetTools.psd1'
          (Get-Content $psd1 -Raw) -replace "ModuleVersion\s*=\s*'[^']*'", "ModuleVersion        = '$version'" | Set-Content $psd1 -NoNewline
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Publish module folder
        run: dotnet publish PSParquetTools/PSParquetTools.csproj -c Release -p:Version=$env:VERSION -o out/ParquetTools
      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          NUGETAPIKEY: ${{ secrets.NUGETAPIKEY }}
        run: Publish-Module -Path ./out/ParquetTools -NuGetApiKey $env:NUGETAPIKEY
